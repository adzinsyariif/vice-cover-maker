<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <span class="brand-mark">VC</span>
      <span class="brand-name">Vice Cover Studio</span>
    </div>
    <div class="seg" id="sizeSeg" role="group" aria-label="Export size">
      <button type="button" data-size="1080x1080">1080 x 1080</button>
      <button type="button" data-size="1080x1350">1080 x 1350</button>
      <button type="button" data-size="1920x1080" class="active">1920 x 1080</button>
    </div>
    <button type="button" id="exportBtn" class="export-btn">Export PNG</button>
  </header>
  <div id="workspace">
    <aside id="rail">
      <section>
        <h2>Photos</h2>
        <label class="file-btn" for="fileInput">Add your photos</label>
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
        <div class="sample-row" id="sampleRow"></div>
        <div id="tray" class="tray"></div>
        <button type="button" id="fillBtn" class="wide-btn">Fill all panels</button>
      </section>
      <section>
        <h2>Layout</h2>
        <div class="seg col" id="layoutSeg">
          <button type="button" data-layout="hero-duo" class="active">Hero Duo</button>
          <button type="button" data-layout="hero-trio">Hero Trio</button>
          <button type="button" data-layout="diptych">Diptych</button>
        </div>
      </section>
      <section>
        <h2>Colour grade</h2>
        <div class="seg col" id="gradeSeg">
          <button type="button" data-grade="sunset" class="active">Sunset</button>
          <button type="button" data-grade="neon">Neon Nights</button>
          <button type="button" data-grade="daylight">Daylight Vice</button>
          <button type="button" data-grade="dusk">Dusk</button>
        </div>
      </section>
      <section>
        <h2>Caption</h2>
        <label class="field">Title
          <input type="text" id="titleInput" value="SUNSET HEIST" maxlength="42">
        </label>
        <label class="field">Subtitle
          <input type="text" id="subtitleInput" value="PALM CITY STORIES" maxlength="48">
        </label>
      </section>
      <section>
        <h2>Selected panel</h2>
        <p id="panelLabel" class="panel-label">Panel 1</p>
        <label class="field">Zoom
          <input type="range" id="zoomRange" min="1" max="3" step="0.01" value="1">
        </label>
        <label class="field">Move X
          <input type="range" id="xRange" min="-0.5" max="0.5" step="0.005" value="0">
        </label>
        <label class="field">Move Y
          <input type="range" id="yRange" min="-0.5" max="0.5" step="0.005" value="0">
        </label>
        <button type="button" id="centreBtn" class="wide-btn">Centre photo</button>
        <p class="hint">Tip: click a photo, then a panel. Drag a photo on the poster to move it, scroll to zoom it.</p>
      </section>
    </aside>
    <main id="stage">
      <canvas id="poster" width="960" height="540"></canvas>
      <p id="status">Add photos, pick a layout, then export your cover.</p>
    </main>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
